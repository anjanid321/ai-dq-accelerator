[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dq-accelerator"
version = "0.1.0"
description = "AI Data Quality Accelerator — guided DQ workflow with Temporal + LangGraph"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # Workflow orchestration
    "temporalio>=1.7.0",
    # AI / agents
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
    "deepagents>=0.5.0",
    "langchain>=1.2.0",
    "langchain-anthropic>=1.4.0",
    # Data quality core
    "ydata-profiling>=4.9.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "pyod>=2.0.0",
    # Output artifacts
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0",
    "pandera>=0.20.0",
    "jinja2>=3.1.0",
    "joblib>=1.4.0",
    # Utilities
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "soda-core-duckdb>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-postgresql>=6.0.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dq_tools", "backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
